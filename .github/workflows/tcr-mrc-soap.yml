name: TCR MRC-SOAP - verificacao tecnico-funcional

on:
  push:
    branches:
      - tcr-2026-fundamentacao-seguranca-soap
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da versao sob teste
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript (lint)
        if: ${{ always() }}
        run: npm run lint
      - name: Rodar testes de regressao (Vitest)
        if: ${{ always() }}
        run: npm test -- --reporter=verbose
      - name: Verificar build
        if: ${{ always() }}
        run: npm run build
